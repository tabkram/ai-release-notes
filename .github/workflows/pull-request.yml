name: Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

# Serialize per PR so canary cleanup never races a canary publish.
concurrency:
  group: pr-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/_build.yml

  compute-version:
    name: Compute canary version
    runs-on: ubuntu-latest
    # Fork PRs cannot read secrets, so the canary flow is same-repo only.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy') &&
      (startsWith(github.head_ref, 'feat/') ||
       startsWith(github.head_ref, 'fix/') ||
       startsWith(github.head_ref, 'chore/') ||
       startsWith(github.head_ref, 'ci/'))

    outputs:
      canary_prefix: ${{ steps.canary.outputs.canary_prefix }}
      canary_version: ${{ steps.canary.outputs.canary_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate canary version
        id: canary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          BASE_VERSION="$(node -p "require('./package.json').version")"
          CANARY_PREFIX="${BASE_VERSION}-canary.${PR_NUMBER}"
          CANARY_VERSION="${CANARY_PREFIX}.${GITHUB_SHA::7}"

          echo "prefix:  $CANARY_PREFIX"
          echo "version: $CANARY_VERSION"

          {
            echo "canary_prefix=$CANARY_PREFIX"
            echo "canary_version=$CANARY_VERSION"
          } >> "$GITHUB_OUTPUT"

  publish-canary:
    name: Publish canary
    runs-on: ubuntu-latest
    needs: [build, compute-version]
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: canary
      url: https://www.npmjs.com/package/ai-release-notes/v/${{ needs.compute-version.outputs.canary_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Remove superseded canary versions
        id: cleanup
        uses: ./.github/actions/unpublish-prefix
        with:
          version_prefix: ${{ needs.compute-version.outputs.canary_prefix }}
          confirm: I confirm to unpublish
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Bump version and publish canary
        env:
          CANARY_VERSION: ${{ needs.compute-version.outputs.canary_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm version "$CANARY_VERSION" --no-git-tag-version
          npm publish --tag canary

      - name: Build PR comment
        id: comment
        env:
          UNPUBLISHED: ${{ steps.cleanup.outputs.unpublished_versions }}
          CANARY_VERSION: ${{ needs.compute-version.outputs.canary_version }}
        run: |
          set -euo pipefail

          CLEANED="∅"
          if [ -n "$UNPUBLISHED" ]; then
            CLEANED=""
            IFS=',' read -ra LIST <<< "$UNPUBLISHED"
            for VERSION in "${LIST[@]}"; do
              CLEANED="~$VERSION~ $CLEANED"
            done
          fi

          {
            echo "body<<COMMENT_EOF"
            echo "🚫 **Unpublished versions:** $CLEANED"
            echo "✅ **Created version:** \`$CANARY_VERSION\`"
            echo "📦 **Published on npm:** [View on npm](https://www.npmjs.com/package/ai-release-notes/v/$CANARY_VERSION)"
            echo ""
            echo "> ⚠️ This version is temporary. It is unpublished on the next PR update and when the PR closes."
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR with published version
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment.outputs.body }}
          reactions: rocket

  unpublish-canary:
    name: Unpublish canary
    runs-on: ubuntu-latest
    needs: compute-version
    if: github.event.action == 'closed'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove canary versions for this PR
        id: cleanup
        uses: ./.github/actions/unpublish-prefix
        with:
          version_prefix: ${{ needs.compute-version.outputs.canary_prefix }}
          confirm: I confirm to unpublish
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Build PR comment
        id: comment
        env:
          UNPUBLISHED: ${{ steps.cleanup.outputs.unpublished_versions }}
        run: |
          set -euo pipefail

          CLEANED="∅"
          if [ -n "$UNPUBLISHED" ]; then
            CLEANED=""
            IFS=',' read -ra LIST <<< "$UNPUBLISHED"
            for VERSION in "${LIST[@]}"; do
              CLEANED="~$VERSION~ $CLEANED"
            done
          fi

          {
            echo "body<<COMMENT_EOF"
            echo "🚫 **Unpublished versions:** $CLEANED"
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR with cleanup result
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment.outputs.body }}
          reactions: rocket
