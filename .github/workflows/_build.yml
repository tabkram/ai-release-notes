name: Build
on:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read CI configuration
        id: config
        uses: ./.github/actions/config

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.config.outputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:cleanup
      - run: npm run lint
      - run: npm test
      - run: npm run build
