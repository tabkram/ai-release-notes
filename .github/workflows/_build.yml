name: Build
on:
  workflow_call:
    secrets:
      MISTRAL_API_KEY:
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read CI configuration
        id: config
        uses: ./.github/actions/config

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.config.outputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:cleanup
      - run: npm run lint
      - run: npm run eval
      - name: Evaluate writing quality (optional Mistral access)
        run: npm run eval -- --judge
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EVAL_PROVIDER: mistral
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_MIN_SCORE: ${{ vars.EVAL_MIN_SCORE || '0' }}
      - run: npm test
      - run: npm run build
