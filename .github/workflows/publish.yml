name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Verify trusted publishing prerequisites
        run: |
          echo "npm $(npm --version) on node $(node --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available. Trusted publishing needs 'id-token: write' permission."
            exit 1
          fi

      - name: Publish package to npm
        run: |
          if ! npm publish; then
            echo "::error::npm publish failed. An E404 on PUT means npm rejected the credentials, not that the package is missing: confirm the trusted publisher on npmjs.com (package ai-release-notes -> Settings -> Trusted publisher -> GitHub Actions, repository tabkram/ai-release-notes, workflow publish.yml)."
            exit 1
          fi
