name: Unpublish from npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version(s) to unpublish (comma-separated)
        required: true
        type: string
      confirm:
        description: Type "I confirm to unpublish" to continue
        required: true
        type: string
      force:
        description: Pass --force to npm unpublish
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unpublish package versions
        uses: ./.github/actions/unpublish
        with:
          versions: ${{ inputs.version }}
          confirm: ${{ inputs.confirm }}
          force: ${{ inputs.force }}
          npm_token: ${{ secrets.NPM_TOKEN }}
